global
    log stdout format raw local0
    maxconn 100

defaults
    log global
    mode tcp
    timeout connect 5s
    timeout client 30s
    timeout server 30s

# --- Postgres write traffic: routes to whichever region's leader is UP ---
listen postgres_write
    bind *:6432
    option httpchk GET /leader
    http-check expect status 200
    default-server inter 3s fall 2 rise 1 on-marked-down shutdown-sessions

    # Region A leaders checked first (active region)
    server patroni-a1 patroni-a1:5432 check port 8008
    server patroni-a2 patroni-a2:5432 check port 8008
    # Region B leaders as backup (passive region, promoted on failover)
    server patroni-b1 patroni-b1:5432 check port 8008 backup
    server patroni-b2 patroni-b2:5432 check port 8008 backup

# --- Stats page for visibility ---
listen stats
    bind *:7000
    mode http
    stats enable
    stats uri /
    stats refresh 5s
