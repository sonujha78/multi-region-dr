<svg width="100%" viewBox="0 0 680 380" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Multi-region DR architecture</title>
<desc>HAProxy routes client writes to Region A's Patroni leader as primary and to Region B as backup. Region A replicates logically to Region B, and Consul WAN federation links the two datacenters for health visibility.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<style>
text { font-family: sans-serif; }
.th { font-size: 14px; font-weight: 500; fill: #222; }
.ts { font-size: 12px; fill: #444; }
.boxA { fill: #E6F1FB; stroke: #185FA5; }
.boxB { fill: #E1F5EE; stroke: #0F6E56; }
.boxGray { fill: #F1EFE8; stroke: #5F5E5A; }
</style>

<text class="ts" x="340" y="12" text-anchor="middle">Clients / app</text>
<line x1="340" y1="16" x2="340" y2="38" stroke="#555" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="250" y="40" width="180" height="50" rx="8" class="boxGray" stroke-width="0.5"/>
<text class="th" x="340" y="60" text-anchor="middle" dominant-baseline="central">HAProxy</text>
<text class="ts" x="340" y="78" text-anchor="middle" dominant-baseline="central">Health-checked routing</text>

<line x1="300" y1="90" x2="185" y2="138" stroke="#555" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="380" y1="90" x2="495" y2="138" stroke="#555" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

<rect x="40" y="140" width="280" height="200" rx="16" class="boxA" stroke-width="0.5"/>
<text class="th" x="180" y="162" text-anchor="middle">Region A (active)</text>

<rect x="60" y="190" width="110" height="44" rx="8" class="boxA" stroke-width="0.5"/>
<text class="ts" x="115" y="212" text-anchor="middle" dominant-baseline="central">Patroni leader</text>

<rect x="190" y="190" width="110" height="44" rx="8" class="boxA" stroke-width="0.5"/>
<text class="ts" x="245" y="212" text-anchor="middle" dominant-baseline="central">Patroni replica</text>

<rect x="60" y="250" width="240" height="44" rx="8" class="boxA" stroke-width="0.5"/>
<text class="ts" x="180" y="272" text-anchor="middle" dominant-baseline="central">Consul (dc-a)</text>

<rect x="360" y="140" width="280" height="200" rx="16" class="boxB" stroke-width="0.5"/>
<text class="th" x="500" y="162" text-anchor="middle">Region B (standby)</text>

<rect x="380" y="190" width="110" height="44" rx="8" class="boxB" stroke-width="0.5"/>
<text class="ts" x="435" y="212" text-anchor="middle" dominant-baseline="central">Patroni leader</text>

<rect x="510" y="190" width="110" height="44" rx="8" class="boxB" stroke-width="0.5"/>
<text class="ts" x="565" y="212" text-anchor="middle" dominant-baseline="central">Patroni replica</text>

<rect x="380" y="250" width="240" height="44" rx="8" class="boxB" stroke-width="0.5"/>
<text class="ts" x="500" y="272" text-anchor="middle" dominant-baseline="central">Consul (dc-b)</text>

<line x1="300" y1="212" x2="378" y2="212" stroke="#378ADD" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<line x1="300" y1="272" x2="378" y2="272" stroke="#777" stroke-width="1" stroke-dasharray="2 3" marker-end="url(#arrow)"/>

</svg>
